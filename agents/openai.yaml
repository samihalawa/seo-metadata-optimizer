interface:
  display_name: "SEO & Metadata Optimizer"
  short_description: "Audit and optimize a URL's full metadata footprint (titles, descriptions, OG/Twitter cards, favicons, visual brand assets) using Desktop Commander and Codex internal image tools."
  default_prompt: "Use $seo-metadata-optimizer to audit and optimize the target URL's metadata footprint: meta titles/descriptions, Open Graph and Twitter cards, favicons, and visual brand/social assets. Fetch the real image assets with Desktop Commander and crack every one with Codex internal image-inspection tools, looping each asset until verified. Do not bias the audit to one template or limit scope to a single context — cover the whole metadata surface and adapt per framework (Next.js, Nuxt, Astro, Hugo, plain HTML). Emit clean production-ready <head> blocks plus a structured FINDINGS/FIXED/EVIDENCE/REMAINING report. Work thoroughly: iterate the Codex image pass on each asset until clean, retry failed fetches with realistic alternatives, and never self-limit because the task is large or multi-step."
